[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-perturb"
version = "0.1.0"
description = "Predict single-cell gene-perturbation responses with a GNN over a swappable biological knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "graph-perturb contributors" }]
keywords = [
    "single-cell",
    "perturb-seq",
    "graph-neural-network",
    "gene-ontology",
    "reactome",
    "string",
    "perturbation-prediction",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "torch-geometric>=2.4",
    "scanpy>=1.9",
    "anndata>=0.9",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "hydra-core>=1.3",
    "typer>=0.9",
    "matplotlib>=3.7",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "jupyter", "nbformat"]

[project.scripts]
graph-perturb = "graph_perturb.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/graph-perturb"
Repository = "https://github.com/your-org/graph-perturb"

[tool.setuptools.packages.find]
include = ["graph_perturb*"]

[tool.setuptools.package-data]
graph_perturb = ["../configs/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
